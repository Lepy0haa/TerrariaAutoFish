# Тесты на каждый коммит; на метку версии (v1.2.3) — ещё и сборка установщика и портативной версии.
# Собранные файлы прикладываются к запуску; релиз выкладывается от своего аккаунта:
# python tools/publish_release.py v1.2.3 (описание — из docs/releases/<метка>.md).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -r requirements.txt

      - name: Russian text recognition
        # тестам чтения надписей нужно русское распознавание текста Windows; не вышло — они пропустятся
        continue-on-error: true
        timeout-minutes: 15
        shell: powershell
        run: |
          $c = Get-WindowsCapability -Online | Where-Object Name -like 'Language.OCR*ru-RU*'
          if ($c -and $c.State -ne 'Installed') { Add-WindowsCapability -Online -Name $c.Name | Out-Null }
          python -c "import ocr; print('OCR:', ocr.available_languages())"

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Check version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          grep -q "VERSION = \"$VER\"" app.py || { echo "app.py VERSION != $VER"; exit 1; }
          grep -q "set VER=$VER" build.bat || { echo "build.bat VER != $VER"; exit 1; }
          test -f "docs/releases/$GITHUB_REF_NAME.md" || { echo "no docs/releases/$GITHUB_REF_NAME.md"; exit 1; }
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Build
        if: startsWith(github.ref, 'refs/tags/v')
        shell: cmd
        run: build.bat --no-pause

      - name: Keep the files
        # релиз выкладывается от своего аккаунта: python tools/publish_release.py <метка>
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: TerrariaAutoFish-${{ env.VER }}
          path: |
            dist/TerrariaAutoFish-${{ env.VER }}-setup.exe
            dist/TerrariaAutoFish-${{ env.VER }}-portable.zip
          retention-days: 30
